name: CI

on:
  push:
    branches: [main, "claude/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository. No job can push, comment, release or mint tokens.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Third-party actions are pinned to full commit SHAs (tags can be moved); the tag is noted for updates.
  #   actions/checkout        v5 = fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
  #   actions/setup-dotnet    v5 = 26b0ec14cb23fa6904739307f278c14f94c95bf1
  #   actions/upload-artifact v6 = b7c566a772e6b6bfb58ed0dc250532a479d7789f
  #   actions/download-artifact v6 = 018cc2cf5baa6db3ef3c5f8a56943fffe632ef53

jobs:
  windows:
    name: Windows build, test and portable package
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
      packages: SnapForge-${{ steps.pkg.outputs.version }}-packages-${{ github.sha }}
      packaged: ${{ steps.pkg.outputs.version != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - id: names
        shell: pwsh
        run: '"artifact=SnapForge-portable-win-x64-dev-${{ github.sha }}" | Out-File -Append $env:GITHUB_OUTPUT'

      - name: Restore (locked mode, signed packages from nuget.org only, vulnerability audit)
        run: dotnet restore SnapForge.sln

      - name: Build (warnings are errors)
        run: dotnet build SnapForge.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test (unit, Windows rendering/capture/clipboard, real-input UI tests)
        id: tests
        # A test failure does not stop packaging, so the portable/installer/screenshot jobs still produce evidence;
        # the job is failed explicitly at its end ("Fail the job if tests failed"), so the run is never green.
        continue-on-error: true
        run: >
          dotnet test SnapForge.sln -c Release --no-build
          --logger "trx;LogFilePrefix=results"
          --logger "console;verbosity=normal"
          --results-directory TestResults
          --collect "XPlat Code Coverage"
          --blame-hang-timeout 5m

      - name: Vulnerable package check
        shell: pwsh
        run: |
          $out = dotnet list SnapForge.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match "has the following vulnerable packages") { throw "Vulnerable NuGet packages found." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          path: TestResults
          retention-days: 14

      # Lock files cover build/test restores. Publishing adds only SDK-implied packages (runtime packs and
      # Microsoft.NET.ILLink.Tasks, versions dictated by the SDK); the shipped projects reference no packages.
      # Those cannot be expressed in a build-time lock file, so locked mode is off for this restore only.
      # Package signature validation (nuget.config: require nuget.org repository signature) still applies.
      # RC3: two programs in one folder — SnapForge Capture (SnapForge.exe) and SnapForge Editor
      # (SnapForgeEditor.exe), each a self-contained single-file exe sharing the WPF native DLLs next to them.
      - name: Publish both programs (self-contained, single-file exes + WPF native DLLs, win-x64)
        shell: pwsh
        run: |
          foreach ($project in 'src/SnapForge.Editor/SnapForge.Editor.csproj', 'src/SnapForge.App/SnapForge.App.csproj') {
            dotnet publish $project -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:ContinuousIntegrationBuild=true -p:RestoreLockedMode=false -o artifacts/portable/SnapForge
            if ($LASTEXITCODE -ne 0) { throw "publish failed: $project" }
          }
          foreach ($exe in 'SnapForge.exe', 'SnapForgeEditor.exe') { if (-not (Test-Path "artifacts/portable/SnapForge/$exe")) { throw "$exe missing from the published folder" } }
          Get-ChildItem artifacts/portable/SnapForge -File | Format-Table Name, Length -AutoSize | Out-String | Write-Output

      - name: Add license, notices, instructions and SHA-256 checksums
        shell: pwsh
        run: |
          $dir = "artifacts/portable/SnapForge"
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Copy-Item README.md, THIRD-PARTY-NOTICES.md, docs/ACCEPTANCE-TESTING.md, docs/ACCEPTANCE-RESULTS-TEMPLATE.md $dir
          if (Test-Path docs/VIDEO-ACCEPTANCE.md) { Copy-Item docs/VIDEO-ACCEPTANCE.md $dir }
          $lines = Get-ChildItem $dir -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $lines | Out-File -Encoding ascii "$dir/SHA256SUMS.txt"
          Get-Content "$dir/SHA256SUMS.txt"
          $exe = ($lines | Where-Object { $_ -like '*  SnapForge.exe' }) -split '\s+' | Select-Object -First 1
          $editor = ($lines | Where-Object { $_ -like '*  SnapForgeEditor.exe' }) -split '\s+' | Select-Object -First 1
          "### Programs`n`nSnapForge.exe (Capture) SHA-256: ``$exe```nSnapForgeEditor.exe (Editor) SHA-256: ``$editor``" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload portable build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: artifacts/portable/SnapForge
          retention-days: 30
          if-no-files-found: error

      # RC3 deliverable: the Windows installer only (both programs, system-wide). The portable folder above is a CI
      # test vehicle, not a release package.
      - name: Release package (Windows installer, both programs) with SHA-256
        id: pkg
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $fileVersion = "1.0.0.$env:GITHUB_RUN_NUMBER"
          $out = "artifacts/release"
          New-Item -ItemType Directory -Force $out | Out-Null
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) { choco install innosetup --version=6.4.3 -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=$version" "/DFileVersion=$fileVersion" "/DSourceDir=$PWD\artifacts\portable\SnapForge" "/DOutputDir=$PWD\$out" installer\SnapForge.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          $runtime = (dotnet msbuild src/SnapForge.App/SnapForge.App.csproj -getProperty:BundledNETCoreAppPackageVersion).Trim()
          python tools/sbom/generate_sbom.py --version $version --commit $env:GITHUB_SHA --runtime $runtime --package (Get-ChildItem "$out/*-setup.exe").FullName --out "$out/SnapForge-$version-sbom.cdx.json"
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }
          Get-ChildItem $out -File | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Tee-Object -Variable sums
          $sums | Out-File -Encoding ascii "$out/SHA256SUMS.txt"
          "### Release candidate packages ($version, build $env:GITHUB_RUN_NUMBER)`n" + (($sums | ForEach-Object { "    $_" }) -join "`n") | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Upload release-candidate packages (not a public release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SnapForge-${{ steps.pkg.outputs.version }}-packages-${{ github.sha }}
          path: artifacts/release
          retention-days: 30
          if-no-files-found: error

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit/UI tests failed (see the Test step). Packages were still built for diagnosis only."
          exit 1

  portable-without-dotnet:
    name: Portable build runs without an installed .NET
    needs: windows
    if: ${{ !cancelled() && needs.windows.outputs.packaged == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20 # +5 for the video quality comparison (two 5 s recordings, decoding, PNG output)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: tests/fixtures

      - name: Download the uploaded artifact (exactly what testers download)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: portable

      - name: Verify SHA-256 checksums
        shell: pwsh
        working-directory: portable
        run: |
          $failed = $false
          foreach ($line in Get-Content SHA256SUMS.txt) {
            $expected, $name = $line -split '\s+', 2
            $actual = (Get-FileHash $name -Algorithm SHA256).Hash
            if ($actual -ne $expected) { Write-Output "MISMATCH $name"; $failed = $true } else { Write-Output "OK  $name" }
          }
          $listed = (Get-Content SHA256SUMS.txt | ForEach-Object { ($_ -split '\s+', 2)[1] })
          Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' -and $listed -notcontains $_.Name } | ForEach-Object { Write-Output "UNLISTED $($_.Name)"; $failed = $true }
          if ($failed) { throw "Checksum verification failed." }

      - name: Hide every .NET installation on this machine
        shell: pwsh
        run: |
          foreach ($p in "$env:ProgramFiles\dotnet", "${env:ProgramFiles(x86)}\dotnet") {
            if (Test-Path $p) { Rename-Item $p "$p-hidden-for-test"; Write-Output "Hid $p" }
          }
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { throw "dotnet is still reachable" }
          Write-Output "No dotnet executable is reachable."

      - name: Run SnapForge.exe --self-test
        shell: pwsh
        working-directory: portable
        env:
          DOTNET_ROOT: C:\does-not-exist
          DOTNET_ROOT_X64: C:\does-not-exist
        run: |
          $report = Join-Path $PWD "self-test.txt"
          $p = Start-Process -FilePath .\SnapForge.exe -ArgumentList '--self-test', "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Output "No report written." }
          Write-Output "Exit code: $($p.ExitCode)"
          if (Test-Path "$env:TEMP\.net\SnapForge") { throw "Unexpected extraction to %TEMP%\.net\SnapForge" }
          Write-Output "Nothing was extracted to %TEMP%\.net."
          if ($p.ExitCode -ne 0) { throw "Self-test failed." }

      - name: Startup windows (FA-001) — Windows start-up shows no window; a launch shows exactly one
        shell: pwsh
        working-directory: portable
        env:
          DOTNET_ROOT: C:\does-not-exist
          DOTNET_ROOT_X64: C:\does-not-exist
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @"
          using System; using System.Collections.Generic; using System.Runtime.InteropServices; using System.Text;
          public static class Wins {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern int GetWindowLong(IntPtr h, int i);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            public static List<string> Captioned(uint pid) {
              var list = new List<string>();
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h) && (GetWindowLong(h, -16) & 0x00C00000) == 0x00C00000) {
                  var sb = new StringBuilder(256); GetWindowText(h, sb, 256); list.Add(sb.ToString());
                }
                return true; }, IntPtr.Zero);
              return list;
            }
          }
          "@
          $log = Join-Path $env:RUNNER_TEMP 'startup-windows.log'
          trap { "FAIL $_" | Tee-Object -FilePath $log -Append | Write-Output; break }
          function Say([string]$m) { $m | Out-File $log -Append; Write-Output $m }
          function Captioned($proc) { $l = [Wins]::Captioned([uint32]$proc.Id); "INFO pid $($proc.Id) captioned windows: [$($l -join ' | ')]" | Out-File $log -Append; $l }
          function Stop-Copy([string]$profile, $proc) {
            [System.Threading.EventWaitHandle]::OpenExisting("Local\SnapForge-SingleInstance-7c1d-p-$profile-exit").Set() | Out-Null
            if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw "copy did not exit" }
          }

          $p = Start-Process .\SnapForge.exe -ArgumentList '--profile', 'ci-startup', '--background' -PassThru
          Start-Sleep -Seconds 8
          $w = @(Captioned $p)
          if ($w.Count -ne 0) { throw "Windows start-up showed windows: $($w -join ', ')" }
          Say "PASS start with Windows (--background): no window (notification-area icon and QuickDock only)"
          Stop-Copy 'ci-startup' $p

          $p = Start-Process .\SnapForge.exe -ArgumentList '--profile', 'ci-first' -PassThru
          Start-Sleep -Seconds 8
          $w = @(Captioned $p)
          if ($w.Count -ne 1 -or $w[0] -notlike 'Welcome*') { throw "first launch: expected only the welcome window, got: $($w -join ', ')" }
          Say "PASS first launch: exactly one window ($($w[0]))"
          Stop-Copy 'ci-first' $p

          $p = Start-Process .\SnapForge.exe -ArgumentList '--profile', 'ci-first' -PassThru
          Start-Sleep -Seconds 8
          $w = @(Captioned $p)
          if ($w.Count -ne 1) { throw "normal launch: expected exactly one window, got: $($w -join ', ')" }
          Say "PASS normal launch: exactly one window ($($w[0]))"
          $second = Start-Process .\SnapForge.exe -ArgumentList '--profile', 'ci-first' -PassThru
          if (-not $second.WaitForExit(20000)) { throw "second launch of the same build did not hand over" }
          Start-Sleep -Seconds 2
          $w = @(Captioned $p)
          if ($w.Count -ne 1) { throw "after a second launch: expected one window, got: $($w -join ', ')" }
          Say "PASS second launch of the same build hands over; still one window ($($w[0]))"
          Stop-Copy 'ci-first' $p

          # RC3: SnapForge Editor is a separate program with its own single instance.
          function Stop-Editor([string]$profile, $proc) {
            [System.Threading.EventWaitHandle]::OpenExisting("Local\SnapForge-Editor-SingleInstance-7c1d-p-$profile-exit").Set() | Out-Null
            if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw "SnapForge Editor did not exit" }
          }
          $normal = "$env:LOCALAPPDATA\SnapForge"
          $normalBefore = if (Test-Path $normal) { Get-ChildItem $normal -Recurse -File | ForEach-Object { "$($_.FullName) $($_.Length) $($_.LastWriteTimeUtc.Ticks)" } } else { @() }
          $lib = "$env:LOCALAPPDATA\SnapForge-Profiles\ci-editor\Library"
          New-Item -ItemType Directory -Force $lib | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\tests\fixtures\legacy-v1-library\library\*" $lib -Recurse -Force

          $capture = Start-Process .\SnapForge.exe -ArgumentList '--profile', 'ci-editor', '--background' -PassThru
          Start-Sleep -Seconds 6
          if (@(Captioned $capture).Count -ne 0) { throw "SnapForge Capture showed a window at Windows start-up" }
          if (Get-Process SnapForgeEditor -ErrorAction SilentlyContinue) { throw "SnapForge Editor started together with SnapForge Capture at Windows start-up" }
          Say "PASS Windows start-up starts SnapForge Capture only (no window, no Editor)"

          $editor = Start-Process .\SnapForgeEditor.exe -ArgumentList '--profile', 'ci-editor', '--open', '71f6ad49-77f1-406f-914f-b6ce01a0555e' -PassThru
          Start-Sleep -Seconds 10
          $w = @(Captioned $editor)
          if ($w.Count -ne 1 -or $w[0] -notlike 'Redacted login*SnapForge Editor') { throw "SnapForge Editor --open: expected one window showing the capture, got: $($w -join ', ')" }
          Say "PASS SnapForge Editor opens a saved capture by id: one window ($($w[0]))"
          $second = Start-Process .\SnapForgeEditor.exe -ArgumentList '--profile', 'ci-editor', '--open', 'a611f5ea-2fa5-4aa7-8e92-59ea727208d2' -PassThru
          if (-not $second.WaitForExit(20000)) { throw "second launch of SnapForge Editor did not hand over" }
          Start-Sleep -Seconds 4
          $w = @(Captioned $editor)
          if ($w.Count -ne 1 -or $w[0] -notlike 'Organised*SnapForge Editor') { throw "second Editor launch: expected the running Editor to show the requested capture, got: $($w -join ', ')" }
          Say "PASS a second launch of SnapForge Editor opens the requested capture in the running Editor ($($w[0]))"
          Stop-Editor 'ci-editor' $editor
          Start-Sleep -Seconds 2
          if ($capture.HasExited) { throw "closing SnapForge Editor stopped SnapForge Capture" }
          Say "PASS closing SnapForge Editor leaves SnapForge Capture running"
          Stop-Copy 'ci-editor' $capture

          $normalAfter = if (Test-Path $normal) { Get-ChildItem $normal -Recurse -File | ForEach-Object { "$($_.FullName) $($_.Length) $($_.LastWriteTimeUtc.Ticks)" } } else { @() }
          if (Compare-Object @($normalBefore) @($normalAfter)) { throw "a test-profile run changed the normal user profile" }
          Say "PASS both programs with isolated profiles wrote only to $env:LOCALAPPDATA\SnapForge-Profiles; the normal profile is untouched"

      - name: Video capability probe (screen capture API, encoders, audio devices)
        if: always()
        timeout-minutes: 5
        shell: pwsh
        working-directory: portable
        run: |
          $out = Join-Path $env:RUNNER_TEMP "video-probe.json"
          $p = Start-Process -FilePath .\SnapForge.exe -ArgumentList '--video-probe', "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Output "No probe report written." }
          Write-Output "Exit code: $($p.ExitCode)"
          Get-WindowsFeature -Name *Media* -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Output

      - name: Video recording self-test (A/V sync, pause/resume, 60 FPS, real screen, single session, cancel)
        if: always()
        timeout-minutes: 8
        shell: pwsh
        working-directory: portable
        run: |
          $out = Join-Path $env:RUNNER_TEMP "video-samples"
          $p = Start-Process -FilePath .\SnapForge.exe -ArgumentList '--video-selftest', "`"$out`"" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\video-selftest.txt"
          Get-Content "$env:RUNNER_TEMP\video-selftest.txt"
          if (Test-Path "$out\report.json") { Get-Content "$out\report.json" }
          Get-ChildItem $out | Format-Table Name, Length -AutoSize | Out-String | Write-Output
          Get-FileHash "$out\*.mp4" -Algorithm SHA256 | Format-Table Hash, Path -AutoSize | Out-String -Width 300 | Write-Output
          Write-Output "Exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Video self-test failed." }

      # docs/VIDEO-QUALITY.md: the same deterministic 1920×1080 scene (small text, fine detail, scrolling text, a
      # moving object, SYNTHETIC camera overlay) recorded with release candidate 2's settings and with the current
      # default, decoded and compared with the source per region. Fails only if the new default is not better on
      # small text (mean small-text PSNR of the static and scrolling sample frames ≥ RC2 + 1.0 dB, and mean SSIM not
      # below RC2) or the new recording dropped more than 1 % of its frames.
      - name: Video quality comparison (RC2 settings vs current default, per-region PSNR/SSIM, native-size PNG crops)
        if: always()
        timeout-minutes: 5
        shell: pwsh
        working-directory: portable
        run: |
          $out = Join-Path $env:RUNNER_TEMP "video-quality"
          $p = Start-Process -FilePath .\SnapForge.exe -ArgumentList '--video-quality', "`"$out`"" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\video-quality.txt"
          Get-Content "$env:RUNNER_TEMP\video-quality.txt"
          if (Test-Path "$out\quality-report.json") { Get-Content "$out\quality-report.json" } else { Write-Output "No quality report written." }
          foreach ($f in Get-ChildItem $out -Filter 'quality-*.png' -ErrorAction SilentlyContinue | Sort-Object Name) {
            $n = $f.BaseName
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "WEBPNG-BEGIN $n $hash"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Output ("WEBPNG " + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Output "WEBPNG-END $n"
          }
          Select-String -Path "$env:RUNNER_TEMP\video-quality.txt" -Pattern '^QUALITY VERDICT' | ForEach-Object { $_.Line }
          Write-Output "Exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Video quality comparison failed (see QUALITY VERDICT above)." }

      - name: Upload video quality comparison (both MP4s, report, PNG crops)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: video-quality-${{ github.sha }}
          path: ${{ runner.temp }}/video-quality
          retention-days: 30
          if-no-files-found: warn

      - name: Feature self-test (OCR, image transforms, GIF export, scrolling capture, video editing)
        if: always()
        timeout-minutes: 10
        shell: pwsh
        working-directory: portable
        run: |
          $out = Join-Path $env:RUNNER_TEMP "feature-selftest"
          $p = Start-Process -FilePath .\SnapForge.exe -ArgumentList '--feature-selftest', "`"$out`"" -Wait -PassThru
          if (Test-Path "$out\report.txt") { Get-Content "$out\report.txt" } else { Write-Output "No report written." }
          Get-ChildItem $out | Format-Table Name, Length -AutoSize | Out-String | Write-Output
          Write-Output "Exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Feature self-test failed." }

      - name: Crash recovery (kill the process while recording, then recover at start-up)
        if: always()
        timeout-minutes: 5
        shell: pwsh
        working-directory: portable
        run: |
          $lib = Join-Path $env:RUNNER_TEMP "kill-library"
          $ready = Join-Path $env:RUNNER_TEMP "kill-ready.txt"
          $p = Start-Process -FilePath .\SnapForge.exe -ArgumentList '--video-record-until-killed', "`"$lib`"", "`"$ready`"" -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path $ready) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $ready)) { Stop-Process -Id $p.Id -Force; throw "Recording did not start." }
          Start-Sleep -Seconds 9
          Stop-Process -Id $p.Id -Force   # no chance to finalize: like a crash or power loss
          $p.WaitForExit()
          $mp4 = Get-Content $ready
          Write-Output "Killed while recording; partial file: $((Get-Item $mp4).Length) bytes"
          $report = Join-Path $env:RUNNER_TEMP "recovery.json"
          $r = Start-Process -FilePath .\SnapForge.exe -ArgumentList '--video-recover', "`"$lib`"", "`"$report`"" -Wait -PassThru
          Get-Content $report
          Write-Output "Exit code: $($r.ExitCode)"
          if ($r.ExitCode -ne 0) { throw "Recovery failed." }

      - name: Upload sample recordings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: video-samples-${{ github.sha }}
          path: ${{ runner.temp }}/video-samples
          retention-days: 30
          if-no-files-found: warn

      - name: Real screenshots of the workspaces, capture panel and widget (demo library in a temporary folder)
        if: always()
        shell: pwsh
        working-directory: portable
        run: |
          $out = Join-Path $env:RUNNER_TEMP "screenshots"
          $p = Start-Process -FilePath .\SnapForge.exe -ArgumentList '--screenshots', "`"$out`"" -Wait -PassThru
          if (Test-Path "$out\screenshots.txt") { Get-Content "$out\screenshots.txt" }
          Write-Output "Exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Screenshot tour failed." }
          foreach ($f in Get-ChildItem "$out\preview" -Filter *.jpg) {
            Write-Output "PREVIEW-BEGIN $($f.Name)"
            Write-Output ([Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName)))
            Write-Output "PREVIEW-END $($f.Name)"
          }

      - name: Full-resolution dark-theme PNGs for the website (base64 in 4000-character lines)
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "screenshots"
          $names = "editor-dark","library-dark","library-videos-dark","capture-panel-dark","capture-panel-video-dark","widget-expanded-dark","recording-dark","recording-toolbar-dark","video-editor-dark","player-dark","settings-widget-dragdrop-dark","settings-recording-dark","ocr-dark","welcome-dark","tray-dark","quickdock-collapsed-dark","quickdock-keyboard-dark","studio-dark","record-panel-on-dark","record-panel-camera-dark","camera-preview-dark","recording-saved-dark"
          foreach ($n in $names) {
            $f = Join-Path $out "$n.png"
            if (-not (Test-Path $f)) { Write-Output "WEBPNG-MISSING $n"; continue }
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f))
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "WEBPNG-BEGIN $n $hash"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Output ("WEBPNG " + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Output "WEBPNG-END $n"
          }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/screenshots
          retention-days: 30
          if-no-files-found: warn

      - name: Replay start-up window and self-test failures (after the long screenshot output)
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'startup-windows.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Output "no start-up log" }
          # Same for the self-test reports: only what failed, so the cause is readable at the end of the job.
          $video = Join-Path $env:RUNNER_TEMP 'video-selftest.txt'
          if (Test-Path $video) { Select-String -Path $video -Pattern 'FAIL|false|error|exception' -CaseSensitive:$false | ForEach-Object { "video self-test: $($_.Line.Trim())" } }
          $quality = Join-Path $env:RUNNER_TEMP 'video-quality.txt'
          if (Test-Path $quality) { Select-String -Path $quality -Pattern '^QUALITY (VERDICT|rc2|rc3)' | ForEach-Object { "video quality: $($_.Line.Trim())" } }
          $report = Join-Path $env:RUNNER_TEMP 'video-samples\report.json'
          if (Test-Path $report) { Select-String -Path $report -Pattern '"(passed|ok|pass)"\s*:\s*false' -Context 6,2 | ForEach-Object { $_.Context.PreContext + $_.Line + $_.Context.PostContext } | ForEach-Object { "video report: $_" } }

  benchmarks:
    name: Library scale benchmarks (production durability)
    needs: windows
    # Long-running (up to ~2 h): once per pushed commit, not again for the pull-request merge build.
    if: ${{ !cancelled() && needs.windows.outputs.packaged == 'true' && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Build the benchmark tool
        run: dotnet build tools/SnapForge.Benchmarks/SnapForge.Benchmarks.csproj -c Release

      - name: Download the portable build (for UI start-up measurements)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: portable

      # One library grows 100 → 1 000 → 5 000 → 10 000 → 25 000 captures. Every capture is written through the
      # production code path with production durability (flush to disk on every file); nothing is bypassed.
      # After each size the real UI is started over that library to measure start-up and responsiveness.
      # A size is skipped (and reported) only if seeding it would not fit the job's time budget.
      - name: Run benchmarks
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "bench-library"
          $out = Join-Path $env:RUNNER_TEMP "bench"
          New-Item -ItemType Directory -Force $out | Out-Null
          $tool = "tools/SnapForge.Benchmarks/bin/Release/net10.0/SnapForge.Benchmarks.exe"
          $budget = [TimeSpan]::FromMinutes(120)
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $count = 0; $msPerCreate = 0.0
          foreach ($size in 100, 1000, 5000, 10000, 25000) {
            if ($msPerCreate -gt 0) {
              $need = [TimeSpan]::FromMilliseconds(($size - $count) * $msPerCreate * 1.15)
              $left = $budget - $clock.Elapsed
              if ($need -gt $left) {
                $msg = "SKIPPED $size captures: seeding needs about $([int]$need.TotalMinutes) min at $msPerCreate ms/capture; $([int]$left.TotalMinutes) min left"
                Write-Output $msg; $msg | Out-File -Append "$out/skipped.txt"; continue
              }
            }
            & $tool --root $root --sizes $size --keep --out "$out/core-$size.json" | Select-Object -Last 3
            if ($LASTEXITCODE -ne 0) { throw "Benchmark tool failed at $size" }
            $r = (Get-Content "$out/core-$size.json" | ConvertFrom-Json).Results[0]
            $count = $r.Captures; $msPerCreate = [double]$r.CreateMsRecent
            $p = Start-Process -FilePath portable\SnapForge.exe -ArgumentList '--benchmark-startup', "`"$root`"", "`"$out/ui-$size.json`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content "$out/ui-$size.json"; throw "UI start-up benchmark failed at $size" }
          }
          # Summary table
          $rows = foreach ($f in Get-ChildItem "$out" -Filter core-*.json | Sort-Object { [int]($_.BaseName -replace 'core-','') }) {
            $c = (Get-Content $f.FullName | ConvertFrom-Json).Results[0]
            $uiFile = Join-Path $out ($f.Name -replace 'core-','ui-')
            $u = if (Test-Path $uiFile) { Get-Content $uiFile | ConvertFrom-Json } else { $null }
            "| $($c.Captures) | $($u.WindowShownSinceProcessStartMs) | $($u.IndexCompleteMs) | $($u.LongestUiFreezeMs) | $($u.LibraryViewMs) | $($u.SearchMs) | $($c.SearchCommonMs) | $($c.ThumbnailMsPerItem) | $($c.AutosaveMedianMs) / $($c.AutosaveP95Ms) | $($c.CreateMsRecent) | $($u.WorkingSetMb) | $($c.DiskMb) |"
          }
          $table = @("| Captures | Window shown (ms from process start) | Index complete (ms) | Longest UI freeze (ms) | Library view (ms) | UI search (ms) | Core search (ms) | Thumbnail (ms each) | Autosave median / p95 (ms) | Capture save (ms) | Working set (MB) | Disk (MB) |", "|---|---|---|---|---|---|---|---|---|---|---|---|") + $rows
          $table | Out-File "$out/summary.md"
          if (Test-Path "$out/skipped.txt") { "`n" + (Get-Content "$out/skipped.txt" -Raw) | Out-File -Append "$out/summary.md" }
          Get-Content "$out/summary.md"
          "### Library benchmarks (production durability)`n" + (Get-Content "$out/summary.md" -Raw) | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem $out -Filter *.json | ForEach-Object { Write-Output "== $($_.Name)"; Get-Content $_.FullName }

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmarks-${{ github.sha }}
          path: ${{ runner.temp }}/bench
          retention-days: 30
          if-no-files-found: warn

  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Test platform-independent core
        run: dotnet test tests/SnapForge.Core.Tests/SnapForge.Core.Tests.csproj -c Release --logger "console;verbosity=normal"
      - name: Compile Windows projects (cross-targeting check)
        run: dotnet build SnapForge.sln -c Release

  rc1-baseline:
    # FA-010: a REAL upgrade test needs the previously distributed release candidate, not the same setup twice.
    # Builds the 1.0.0-rc.1 per-user installer from its exact source commit (748eedb, CI run 83).
    name: Build the previous release candidate (rc.1) for upgrade testing
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: 748eedba8cf5d9281cbd04aa7311e02ce8ab96c3

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Publish rc.1 and build its per-user installer
        shell: pwsh
        run: |
          dotnet publish src/SnapForge.App/SnapForge.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:ContinuousIntegrationBuild=true -p:RestoreLockedMode=false -o artifacts/portable/SnapForge
          if ($LASTEXITCODE -ne 0) { throw "rc.1 publish failed" }
          Copy-Item LICENSE artifacts/portable/SnapForge/LICENSE.txt
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --version=6.4.3 -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=1.0.0-rc.1" "/DFileVersion=1.0.0.83" "/DSourceDir=$PWD\artifacts\portable\SnapForge" "/DOutputDir=$PWD\artifacts\rc1" installer\SnapForge.iss
          if ($LASTEXITCODE -ne 0) { throw "rc.1 installer build failed" }
          Get-ChildItem artifacts/rc1

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rc1-baseline-setup-${{ github.sha }}
          path: artifacts/rc1
          retention-days: 7
          if-no-files-found: error

  rc2-baseline:
    # RC3: the upgrade test also needs the real system-wide 1.0.0-rc.2 installer, built from its exact package commit
    # (6d46bd9, CI run 143).
    name: Build the previous release candidate (rc.2) for upgrade testing
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: 6d46bd9f9fa425b5354567c60d7919a79a8d656a

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Publish rc.2 and build its system-wide installer
        shell: pwsh
        run: |
          dotnet publish src/SnapForge.App/SnapForge.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:ContinuousIntegrationBuild=true -p:RestoreLockedMode=false -p:SnapForgeBuildNumber=143 -o artifacts/portable/SnapForge
          if ($LASTEXITCODE -ne 0) { throw "rc.2 publish failed" }
          Copy-Item LICENSE artifacts/portable/SnapForge/LICENSE.txt
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --version=6.4.3 -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=1.0.0-rc.2" "/DFileVersion=1.0.0.143" "/DSourceDir=$PWD\artifacts\portable\SnapForge" "/DOutputDir=$PWD\artifacts\rc2" installer\SnapForge.iss
          if ($LASTEXITCODE -ne 0) { throw "rc.2 installer build failed" }
          Get-ChildItem artifacts/rc2

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rc2-baseline-setup-${{ github.sha }}
          path: artifacts/rc2
          retention-days: 7
          if-no-files-found: error

  installer:
    name: Installer — clean install, rc.2 → rc.3 and rc.1 → rc.3 upgrades, running copies, interrupted setup, repair, two users, uninstall keeps data
    needs: [windows, rc1-baseline, rc2-baseline]
    if: ${{ !cancelled() && needs.windows.outputs.packaged == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: tests/fixtures

      - name: Download the release-candidate package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.windows.outputs.packages }}
          path: packages

      - name: Download the rc.1 baseline installer
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: rc1-baseline-setup-${{ github.sha }}
          path: rc1

      - name: Download the rc.2 baseline installer
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: rc2-baseline-setup-${{ github.sha }}
          path: rc2

      - name: Verify package checksums
        shell: pwsh
        working-directory: packages
        run: |
          foreach ($line in Get-Content SHA256SUMS.txt) {
            $expected, $name = $line -split '\s+', 2
            if ((Get-FileHash $name -Algorithm SHA256).Hash -ne $expected) { throw "MISMATCH $name" }
            Write-Output "OK  $name"
          }

      - name: Hide every .NET installation (the installed programs must be self-contained)
        shell: pwsh
        run: |
          foreach ($p in "$env:ProgramFiles\dotnet", "${env:ProgramFiles(x86)}\dotnet") { if (Test-Path $p) { Rename-Item $p "$p-hidden-for-test" } }

      - name: Clean install of rc.3 (both programs, two shortcuts, HKLM entry, protected folder), then uninstall
        shell: pwsh
        env:
          DOTNET_ROOT: C:\does-not-exist
        run: |
          $ErrorActionPreference = 'Stop'
          $new = (Get-ChildItem packages\*-setup.exe | Select-Object -First 1).FullName
          $machine = Join-Path $env:ProgramFiles "SnapForge"
          $programs = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs"
          function Setup([string]$exe, [string]$a) { $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru; return $p.ExitCode }
          if ((Setup $new '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=clean-install.log') -ne 0) { Get-Content clean-install.log -Tail 40; throw "clean install failed" }
          foreach ($exe in 'SnapForge.exe', 'SnapForgeEditor.exe') {
            if (-not (Test-Path "$machine\$exe")) { throw "$exe not installed" }
            $v = (Get-Item "$machine\$exe").VersionInfo
            if ($v.ProductVersion -notlike '1.0.0-rc.3*') { throw "$exe has product version $($v.ProductVersion)" }
            Write-Output "PASS $exe installed: $($v.ProductVersion) (file $($v.FileVersion))"
          }
          foreach ($lnk in 'SnapForge Capture.lnk', 'SnapForge Editor.lnk') { if (-not (Test-Path "$programs\$lnk")) { throw "Start menu shortcut $lnk missing" } }
          if (Test-Path "$programs\SnapForge.lnk") { throw "old single SnapForge shortcut present" }
          Write-Output "PASS two all-users Start menu shortcuts: SnapForge Capture, SnapForge Editor"
          $acl = Get-Acl $machine
          $bad = $acl.Access | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.IdentityReference -match 'Users|Everyone|Authenticated' -and ((($_.FileSystemRights -band ([System.Security.AccessControl.FileSystemRights]'CreateFiles, AppendData, WriteExtendedAttributes, WriteAttributes, DeleteSubdirectoriesAndFiles, Delete, ChangePermissions, TakeOwnership')) -ne 0) -or (([int64]$_.FileSystemRights -band 0x50000000) -ne 0)) }
          if ($bad) { $bad | Format-List; throw "Program Files folder is writable by standard users" }
          Write-Output "PASS $machine is not writable by Users/Everyone/Authenticated Users"
          foreach ($exe in 'SnapForge.exe', 'SnapForgeEditor.exe') {
            $out = Join-Path $env:RUNNER_TEMP "clean-$exe-self-test.txt"
            $p = Start-Process -FilePath "$machine\$exe" -ArgumentList '--profile', 'ci-clean', '--self-test', "`"$out`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $out; throw "$exe self-test failed after a clean install" }
            Write-Output "PASS installed $exe self-test"
          }
          $uninst = Get-ChildItem $machine -Filter "unins*.exe" | Select-Object -First 1
          if ((Setup $uninst.FullName '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART') -ne 0) { throw "uninstall after clean install failed" }
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$machine\SnapForge.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if ((Test-Path "$machine\SnapForge.exe") -or (Test-Path "$machine\SnapForgeEditor.exe")) { throw "uninstall left a program" }
          foreach ($lnk in 'SnapForge Capture.lnk', 'SnapForge Editor.lnk') { if (Test-Path "$programs\$lnk") { throw "uninstall left $lnk" } }
          Write-Output "PASS uninstall after a clean install removed both programs and both shortcuts"

      - name: Real upgrade rc.2 (system-wide) → rc.3 with user data and a start-with-Windows entry
        shell: pwsh
        env:
          DOTNET_ROOT: C:\does-not-exist
        run: |
          $ErrorActionPreference = 'Stop'
          $old = (Get-ChildItem rc2\*-setup.exe | Select-Object -First 1).FullName
          $new = (Get-ChildItem packages\*-setup.exe | Select-Object -First 1).FullName
          $machine = Join-Path $env:ProgramFiles "SnapForge"
          $data = Join-Path $env:LOCALAPPDATA "SnapForge"
          $programs = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs"
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          function Setup([string]$exe, [string]$a) { $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru; return $p.ExitCode }
          function DataHash { Get-ChildItem $data -Recurse -File | Where-Object { $_.FullName -notmatch '\\(logs|Temp|Handoff)\\' } | Sort-Object FullName | ForEach-Object { "$($_.FullName.Substring($data.Length)) $((Get-FileHash $_.FullName).Hash)" } }

          if ((Setup $old '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=rc2-install.log') -ne 0) { Get-Content rc2-install.log -Tail 40; throw "rc.2 install failed" }
          if ((Get-Item "$machine\SnapForge.exe").VersionInfo.ProductVersion -notlike '1.0.0-rc.2*') { throw "rc.2 not installed" }
          if (-not (Test-Path "$programs\SnapForge.lnk")) { throw "rc.2 shortcut missing" }
          Write-Output "PASS real rc.2 installed system-wide (single SnapForge shortcut)"

          # Representative data in the rc.2 user's profile: the legacy fixture Library (captures with annotations and
          # redactions, Trash, tags/folders, a video, a damaged item), a marker, and rc.2's start-with-Windows entry.
          New-Item -ItemType Directory -Force "$data\Library" | Out-Null
          Copy-Item tests\fixtures\legacy-v1-library\library\* "$data\Library" -Recurse -Force
          New-Item -ItemType Directory -Force "$data\Library\keep-me" | Out-Null
          Set-Content "$data\Library\keep-me\marker.txt" "user data"
          $p = Start-Process -FilePath "$machine\SnapForge.exe" -ArgumentList '--library-check', "`"$env:RUNNER_TEMP\rc2-library-check.txt`"", '--expect-images', '3', '--expect-videos', '1' -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\rc2-library-check.txt"
          if ($p.ExitCode -ne 0) { throw "rc.2 could not open the seeded Library" }
          if (-not (Test-Path $runKey)) { New-Item -Path $runKey -Force | Out-Null } # absent on a fresh runner profile
          Set-ItemProperty $runKey -Name 'SnapForge' -Value "`"$machine\SnapForge.exe`" --background"
          $before = DataHash

          if ((Setup $new '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=upgrade-rc2.log') -ne 0) { Get-Content upgrade-rc2.log -Tail 40; throw "upgrade from rc.2 failed" }
          foreach ($exe in 'SnapForge.exe', 'SnapForgeEditor.exe') {
            if ((Get-Item "$machine\$exe").VersionInfo.ProductVersion -notlike '1.0.0-rc.3*') { throw "$exe was not upgraded" }
          }
          foreach ($lnk in 'SnapForge Capture.lnk', 'SnapForge Editor.lnk') { if (-not (Test-Path "$programs\$lnk")) { throw "Start menu shortcut $lnk missing after upgrade" } }
          if (Test-Path "$programs\SnapForge.lnk") { throw "the old rc.2 shortcut was not removed" }
          $entries = @(@("HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{6E0C3B1A-58A2-4E39-9F3B-0D6F4C1C7A51}_is1") | Where-Object { Test-Path $_ })
          if ($entries.Count -ne 1 -or (Get-ItemProperty $entries[0]).DisplayVersion -ne '1.0.0-rc.3') { throw "Installed apps entry not upgraded in place" }
          $run = Get-ItemProperty $runKey
          $snap = $run.PSObject.Properties | Where-Object { "$($_.Value)" -like '*SnapForge*' }
          if (@($snap).Count -ne 1 -or $snap.Value -ne "`"$machine\SnapForge.exe`" --background") { $snap | Format-List; throw "start-with-Windows entry changed or duplicated" }
          if (Compare-Object $before (DataHash)) { throw "UPGRADING FROM rc.2 CHANGED USER DATA" }
          Write-Output "PASS rc.2 → rc.3: both programs upgraded in place, two shortcuts (old one removed), one Installed apps entry (1.0.0-rc.3), one start-with-Windows entry still starting SnapForge Capture, user data byte-identical"
          foreach ($exe in 'SnapForge.exe', 'SnapForgeEditor.exe') {
            $report = Join-Path $env:RUNNER_TEMP "upgraded-$exe-library-check.txt"
            $p = Start-Process -FilePath "$machine\$exe" -ArgumentList '--library-check', "`"$report`"", '--expect-images', '3', '--expect-videos', '1' -Wait -PassThru
            Get-Content $report
            if ($p.ExitCode -ne 0) { throw "$exe could not open the upgraded user's Library" }
          }
          if (Compare-Object $before (DataHash)) { throw "OPENING THE LIBRARY AFTER THE UPGRADE CHANGED USER DATA" }
          Write-Output "PASS after the upgrade both programs open the rc.2 user's Library with all items; data still byte-identical"

      - name: Real upgrade rc.1 (per-user) → rc.3, migrated as the signed-in user
        shell: pwsh
        env:
          DOTNET_ROOT: C:\does-not-exist
        run: |
          $ErrorActionPreference = 'Stop'
          $old = (Get-ChildItem rc1\*-setup.exe | Select-Object -First 1).FullName
          $perUser = Join-Path $env:LOCALAPPDATA "Programs\SnapForge"
          $machine = Join-Path $env:ProgramFiles "SnapForge"
          $data = Join-Path $env:LOCALAPPDATA "SnapForge"
          $userShortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\SnapForge.lnk"
          function DataHash { Get-ChildItem $data -Recurse -File | Where-Object { $_.FullName -notmatch '\\(logs|Temp|Handoff)\\' } | Sort-Object FullName | ForEach-Object { "$($_.FullName.Substring($data.Length)) $((Get-FileHash $_.FullName).Hash)" } }
          $p = Start-Process -FilePath $old -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /LOG=rc1-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "rc.1 install failed" }
          if (-not (Test-Path "$perUser\SnapForge.exe")) { throw "rc.1 not installed per-user" }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run')) { New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' | Out-Null }
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'SnapForge' -Value "`"$perUser\SnapForge.exe`" --background"
          $before = DataHash
          Write-Output "PASS real rc.1 installed per-user next to the system-wide rc.3, with a start-with-Windows entry pointing at it"
          $p = Start-Process -FilePath "$machine\SnapForge.exe" -ArgumentList '--migrate-per-user-install', '--yes' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "migration exited $($p.ExitCode)" }
          if (Test-Path "$perUser\SnapForge.exe") { throw "old per-user copy still present" }
          if (Test-Path $userShortcut) { throw "old per-user Start menu shortcut still present" }
          if (Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq 'SnapForge' }) { throw "old per-user Installed apps entry still present" }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').SnapForge
          if ($run -ne "`"$machine\SnapForge.exe`" --background") { throw "start-with-Windows entry not moved to the new SnapForge Capture: $run" }
          if (Compare-Object $before (DataHash)) { throw "MIGRATION CHANGED USER DATA" }
          Write-Output "PASS rc.1 per-user copy, shortcut and Installed apps entry removed as the signed-in user; start-with-Windows now starts the installed SnapForge Capture; user data byte-identical"

      - name: Running Capture or Editor blocks setup (never killed); interrupted setup recovers by running setup again
        shell: pwsh
        env:
          DOTNET_ROOT: C:\does-not-exist
        run: |
          $ErrorActionPreference = 'Stop'
          $new = (Get-ChildItem packages\*-setup.exe | Select-Object -First 1).FullName
          $machine = Join-Path $env:ProgramFiles "SnapForge"
          foreach ($exe in 'SnapForge.exe', 'SnapForgeEditor.exe') {
            $arguments = if ($exe -eq 'SnapForge.exe') { @('--profile', 'ci-running', '--background') } else { @('--profile', 'ci-running') }
            $app = Start-Process -FilePath "$machine\$exe" -ArgumentList $arguments -PassThru
            Start-Sleep -Seconds 6
            if ($app.HasExited) { throw "$exe test copy did not stay running" }
            $hash = (Get-FileHash "$machine\$exe").Hash
            $setup = Start-Process -FilePath $new -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=blocked.log' -PassThru
            if (-not $setup.WaitForExit(90000)) { $setup.Kill(); Write-Output "INFO setup kept waiting for $exe to exit (killed setup after 90 s)" }
            elseif ($setup.ExitCode -eq 0) { throw "setup replaced files while $exe was running" }
            else { Write-Output "INFO setup refused while $exe was running (exit $($setup.ExitCode))" }
            if ($app.HasExited) { throw "SETUP STOPPED THE RUNNING $exe" }
            if ((Get-FileHash "$machine\$exe").Hash -ne $hash) { throw "files replaced while $exe was running" }
            $name = if ($exe -eq 'SnapForge.exe') { 'SnapForge-SingleInstance-7c1d' } else { 'SnapForge-Editor-SingleInstance-7c1d' }
            [System.Threading.EventWaitHandle]::OpenExisting("Local\$name-p-ci-running-exit").Set() | Out-Null
            if (-not $app.WaitForExit(30000)) { throw "$exe test copy did not exit on request" }
            Write-Output "PASS a running $exe blocks setup, is not stopped, and exits on request"
          }

          # Interrupted setup: kill it while it replaces files, then run it again (the documented recovery path).
          $setup = Start-Process -FilePath $new -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=interrupted.log' -PassThru
          Start-Sleep -Milliseconds 2500
          if (-not $setup.HasExited) { Stop-Process -Id $setup.Id -Force; Get-Process | Where-Object { $_.Path -like "$env:TEMP\is-*" } | Stop-Process -Force -ErrorAction SilentlyContinue; Write-Output "INFO setup killed while running" } else { Write-Output "INFO setup finished before it could be interrupted (exit $($setup.ExitCode))" }
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath $new -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=repair-after-interrupt.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content repair-after-interrupt.log -Tail 40; throw "setup after an interrupted setup failed" }
          foreach ($exe in 'SnapForge.exe', 'SnapForgeEditor.exe') {
            $out = Join-Path $env:RUNNER_TEMP "repaired-$exe-self-test.txt"
            $p = Start-Process -FilePath "$machine\$exe" -ArgumentList '--profile', 'ci-repair', '--self-test', "`"$out`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $out; throw "$exe does not work after recovering from an interrupted setup" }
          }
          Write-Output "PASS after an interrupted setup, running setup again repaired the installation (both programs pass their self-test)"

      - name: Repair, second Windows user, uninstall keeps data
        shell: pwsh
        env:
          DOTNET_ROOT: C:\does-not-exist
        run: |
          $ErrorActionPreference = 'Stop'
          $new = (Get-ChildItem packages\*-setup.exe | Select-Object -First 1).FullName
          $machine = Join-Path $env:ProgramFiles "SnapForge"
          $data = Join-Path $env:LOCALAPPDATA "SnapForge"

          $p = Start-Process -FilePath $new -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=repair.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "repair failed" }
          Write-Output "PASS repair (same version over itself)"

          # A second Windows user: own data folder, the first user's data untouched.
          $before = Get-ChildItem $data -Recurse -File | Where-Object { $_.FullName -notmatch '\\(logs|Temp|Handoff)\\' } | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          $pw = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(18)) + 'aA1!'
          net user sftest2 $pw /add /y | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential('sftest2', (ConvertTo-SecureString $pw -AsPlainText -Force))
          # Start-Process -Credential hands the new process THIS account's environment; a real sign-in gives the user
          # their own, so the test sets the second user's profile variables (folders resolve from %USERPROFILE%).
          $u2 = 'C:\Users\sftest2'
          $user2Env = @{ USERPROFILE = $u2; HOMEPATH = '\Users\sftest2'; USERNAME = 'sftest2'; LOCALAPPDATA = "$u2\AppData\Local"; APPDATA = "$u2\AppData\Roaming"; TEMP = "$u2\AppData\Local\Temp"; TMP = "$u2\AppData\Local\Temp" }
          foreach ($exe in 'SnapForge.exe', 'SnapForgeEditor.exe') {
            $report = "C:\Users\Public\sftest2-$exe-library-check.txt"
            $p = Start-Process -FilePath "$machine\$exe" -ArgumentList '--library-check', "`"$report`"" -Credential $cred -LoadUserProfile -Wait -PassThru -WorkingDirectory 'C:\Users\Public' -Environment $user2Env
            if (Test-Path $report) { Get-Content $report } else { Write-Output "WARN no report from the second user (exit $($p.ExitCode))" }
            if ($p.ExitCode -ne 0) { throw "second user could not run $exe" }
            if (-not ((Get-Content $report) -match 'C:\\Users\\sftest2\\AppData\\Local\\SnapForge')) { throw "second user's data folder is not in their own profile ($exe)" }
          }
          $after = Get-ChildItem $data -Recurse -File | Where-Object { $_.FullName -notmatch '\\(logs|Temp|Handoff)\\' } | ForEach-Object { (Get-FileHash $_.FullName).Hash } | Sort-Object
          if (Compare-Object $before $after) { throw "second user's run changed the first user's data" }
          Write-Output "PASS a second Windows user runs both installed programs with their own data folder; first user's data untouched"

          # Uninstall (elevated): programs, entry and shortcuts removed; nobody's data touched.
          $uninst = Get-ChildItem $machine -Filter "unins*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $uninst.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$machine\SnapForge.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if ((Test-Path "$machine\SnapForge.exe") -or (Test-Path "$machine\SnapForgeEditor.exe")) { throw "uninstall left a program" }
          foreach ($lnk in 'SnapForge Capture.lnk', 'SnapForge Editor.lnk') { if (Test-Path (Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\$lnk")) { throw "uninstall left $lnk" } }
          foreach ($k in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall') {
            if (Test-Path "$k\{6E0C3B1A-58A2-4E39-9F3B-0D6F4C1C7A51}_is1") { throw "uninstall left the Installed apps entry under $k" }
          }
          if (-not (Test-Path "$data\Library\keep-me\marker.txt")) { throw "UNINSTALL DELETED USER DATA" }
          if (-not (Test-Path 'C:\Users\sftest2\AppData\Local\SnapForge')) { throw "UNINSTALL DELETED THE SECOND USER'S DATA" }
          Write-Output "PASS uninstall removed both programs, the entry and the shortcuts; both users' data kept"
          net user sftest2 /delete | Out-Null

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-logs-${{ github.sha }}
          path: |
            *.log
            ${{ runner.temp }}/*.txt
          retention-days: 14
