name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  windows:
    name: Windows build, test and portable package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore (NuGet vulnerability audit enabled)
        run: dotnet restore SnapForge.sln

      - name: Build (warnings are errors)
        run: dotnet build SnapForge.sln -c Release --no-restore

      - name: Test (unit + Windows rendering, capture and UI smoke tests)
        run: >
          dotnet test SnapForge.sln -c Release --no-build
          --logger "trx;LogFilePrefix=results"
          --logger "console;verbosity=normal"
          --results-directory TestResults
          --collect "XPlat Code Coverage"
          --blame-hang-timeout 5m

      - name: Vulnerable package check
        shell: pwsh
        run: |
          $out = dotnet list SnapForge.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match "has the following vulnerable packages") { throw "Vulnerable NuGet packages found." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          retention-days: 14

      - name: Publish portable build (self-contained, single file, win-x64)
        run: >
          dotnet publish src/SnapForge.App/SnapForge.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o artifacts/portable/SnapForge

      - name: Add notices and checksum
        shell: pwsh
        run: |
          Copy-Item README.md, THIRD-PARTY-NOTICES.md artifacts/portable/SnapForge/
          Copy-Item docs/ACCEPTANCE-TESTING.md artifacts/portable/SnapForge/
          $hash = (Get-FileHash artifacts/portable/SnapForge/SnapForge.exe -Algorithm SHA256).Hash
          "$hash  SnapForge.exe" | Out-File -Encoding ascii artifacts/portable/SnapForge/SHA256SUMS.txt
          Write-Output "SnapForge.exe SHA-256: $hash"
          "### Portable build`n`nSnapForge.exe SHA-256: ``$hash``" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: SnapForge-portable-win-x64-dev-${{ github.sha }}
          path: artifacts/portable/SnapForge
          retention-days: 30

  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test platform-independent core
        run: dotnet test tests/SnapForge.Core.Tests/SnapForge.Core.Tests.csproj -c Release --logger "console;verbosity=normal"
      - name: Compile Windows projects (cross-targeting check)
        run: dotnet build SnapForge.sln -c Release
