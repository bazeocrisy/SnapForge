# SnapForge website: validate on every change; deploy to GitHub Pages ONLY when the owner runs this workflow by hand
# from `main`, ticks "deploy", and has set the repository variable WEBSITE_DEPLOY_APPROVED=true.
# Nothing here deploys automatically. See website/README.md ("Deployment").
name: Website

on:
  push:
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish website/public to GitHub Pages (owner-approved releases only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build is up to date and valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate configuration, links, accessibility basics, no trackers, no external resources
        run: python3 website/build.py --check

  deploy:
    name: Deploy to GitHub Pages (manual, owner-approved)
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy &&
      github.ref == 'refs/heads/main' && vars.WEBSITE_DEPLOY_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
